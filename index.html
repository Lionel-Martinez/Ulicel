<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ulicel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
</head>
<body>
  <!-- Agregar barra de navegación -->
  
<nav class="bg-slate-900 fixed w-full z-20 top-0 start-0 border-b border-slate-700">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
    <a href="#" class="flex items-center">
        <img src="img/ulicel-logo.jpeg" class="h-7" alt="Flowbite Logo" />
        <span class="self-center text-xl text-white font-semibold whitespace-nowrap">Ulicel</span>
    </a>
    <div class="hidden w-full md:block md:w-auto" id="navbar-default">
      <ul class="font-medium flex flex-col p-4 md:p-0 mt-4 border border-slate-700 rounded-base bg-slate-900 md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 md:bg-slate-900">
        <li>
          <a href="#" class="block py-2 px-3 text-white rounded hover:bg-slate-900 md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Inicio</a>
        </li>
        <li>
          <a href="#" class="block py-2 px-3 text-white rounded hover:bg-slate-900 md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Servicios</a>
        </li>
        <li>
          <a href="#" class="block py-2 px-3 text-white rounded hover:bg-slate-900 md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Nosotros</a>
        </li>
        <li>
          <a href="#" class="block py-2 px-3 text-white rounded hover:bg-slate-900 md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Proceso</a>
        </li>
        <li>
          <a href="#" class="block py-2 px-3 text-white rounded hover:bg-slate-900 md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Opiniones</a>
        </li>
        <li>
          <a href="#" class="block py-2 px-3 text-white rounded hover:bg-slate-900 md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Contacto</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Inicio -->
<section class="banner">
  <div class="banner-texto">
    <h1>Bienvenido <span> a Ulicel</span></h1>
    <p>Soluciones rápidas, garantizadas y al mejor precio. Traé tu dispositivo y nosotros nos encargamos de repararlo con la mayor calidad y profesionalismo</p>
  </div>
  <div class="banner-imagen">
    <img src="img/reparacion 1.jpeg" alt="Imagen de banner">
    <img src="img/reparacion 2.jpeg" alt="Imagen de banner">
    <img src="img/reparacion 3.jpeg" alt="Imagen de banner">
  </div>
</section>


  <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
</body>
</html>
